# =============================================================================
# 仅用于生成 OpenAPI 文档的 profile
#
# 用法：
#   mvn spring-boot:run -Dspring-boot.run.profiles=openapi
# 或：
#   java -jar legislation-edition-backend.jar --spring.profiles.active=openapi
#
# 此 profile 使用 H2 内存数据库，不会真的去查 MySQL，
# 让 springdoc-openapi 仍能完整扫描 controller 路由 + 实体类 Schema，
# 产出与生产环境完全一致的 openapi.json / Knife4j 文档。
# =============================================================================

server:
  port: 8083
  servlet:
    context-path: /api

spring:
  application:
    name: legislation-edition-backend

  # H2 内存数据库，避免依赖本地 MySQL
  datasource:
    url: jdbc:h2:mem:legislation_openapi;MODE=MySQL;DB_CLOSE_DELAY=-1;NON_KEYWORDS=USER,VALUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      driver-class-name: org.h2.Driver
      url: jdbc:h2:mem:legislation_openapi;MODE=MySQL;DB_CLOSE_DELAY=-1;NON_KEYWORDS=USER,VALUE
      username: sa
      password:
      initial-size: 1
      min-idle: 1
      max-active: 5

  # Flyway 自动建表(H2 模式:仅跑 V1 表结构,V2 seed 用 MySQL 专属语法已剔除)
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # 不启用 Quartz / Redis / Neo4j
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.quartz.QuartzAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
      - org.springframework.boot.autoconfigure.data.neo4j.Neo4jDataAutoConfiguration
      - org.springframework.boot.autoconfigure.data.neo4j.Neo4jReactiveDataAutoConfiguration
      - org.springframework.boot.autoconfigure.data.neo4j.Neo4jRepositoriesAutoConfiguration
      - org.springframework.boot.autoconfigure.neo4j.Neo4jReactiveRepositoriesAutoConfiguration
      - org.springframework.boot.actuate.autoconfigure.neo4j.Neo4jHealthContributorAutoConfiguration
      - org.springframework.boot.actuate.autoconfigure.neo4j.Neo4jReactiveHealthContributorAutoConfiguration

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.legal.legislation.entity
  global-config:
    db-config:
      logic-delete-field: is_deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
      id-type: auto

logging:
  level:
    root: WARN
    com.legal: INFO
    com.legal.legislation.task: OFF   # 关掉定时任务噪音
  pattern:
    console: "%d{HH:mm:ss} %-5level %logger{20} - %msg%n"

# AI 配置保持关闭
ai:
  draft-generation:
    enabled: false
  review:
    enabled: false
  evaluation:
    enabled: false

# =============================================================================
# springdoc-openapi & knife4j（与 application.yml 保持一致）
# =============================================================================
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
    display-request-duration: true
    persist-authorization: true
  default-flat-param-object: true
  packages-to-scan: com.legal.legislation.controller
  paths-to-match: /**
  show-actuator: false

# 集成测试不期望外部 health 探针
management:
  health:
    defaults:
      enabled: false

knife4j:
  enable: true
  setting:
    language: zh_cn
    enable-version: true
    enable-swagger-models: true
    enable-document-manage: true
    enable-host-extend: true
    enable-search: true
    enable-footer: true
    footer-content: "智立法 · 研发内部文档，请勿对外发布"
    enable-group: false