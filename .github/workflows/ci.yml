name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  backend-compile-test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root123
          MYSQL_DATABASE: legal_legislation
        ports: ['3306:3306']
        options: --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proot123" --health-interval 10s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: maven

      - name: Compile & Unit Test (offline)
        working-directory: legislation-edition/backend
        run: |
          mvn -B -Dtest="SuperiorLawParserTest,ReviewRuleTest,DocxExporterTest" test

      - name: Integration Test (H2 + openapi profile, no DB)
        working-directory: legislation-edition/backend
        run: |
          mvn -B -Dtest=IntegrationTest "-Dspring.profiles.active=openapi" test

      - name: Build jar
        working-directory: legislation-edition/backend
        run: |
          mvn -B -DskipTests package

      - name: Export OpenAPI JSON (offline)
        working-directory: legislation-edition/backend
        run: |
          chmod +x ../../scripts/export-openapi.sh
          OUTPUT_PATH="$GITHUB_WORKSPACE/openapi.json" ../../scripts/export-openapi.sh
          ls -la "$GITHUB_WORKSPACE/openapi.json"

      - name: Upload OpenAPI artifact
        uses: actions/upload-artifact@v4
        with:
          name: openapi-docs
          path: openapi.json

  backend-frontend-build:
    runs-on: ubuntu-latest
    needs: backend-compile-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: legislation-edition/web_frontend/package-lock.json
      - name: Install
        working-directory: legislation-edition/web_frontend
        run: |
          npm install --no-audit --no-fund
      - name: Build
        working-directory: legislation-edition/web_frontend
        run: npm run build
      - name: Test (Vitest smoke + utils + store)
        working-directory: legislation-edition/web_frontend
        run: npm test